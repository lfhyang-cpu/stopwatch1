<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>어질리티 스탑워치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Rubik:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg: #eef6ec; --card: #ffffff; --text: #1f2a1c; --muted: #5d6a57; --line: #dfe7dc;
    --accent: #f59e0b; --title: #b45309; --focus: #b45309; --go: #15803d; --stop: #dc2626; --btn: #e3eadf;
    --best: #15803d; --worst: #c81e1e; --undo: #1f2a1c;
    --sky1: #8fd3ff; --sky2: #e6f6ff; --sun: #ffd84d; --cloud: #ffffff; --stars: 0;
    --hill: #9ed27a; --hill2: #7fbf5c; --grass: #7cc35a; --grass2: #6ab04a;
    --dirt: #c99159; --dirtEdge: #a8733f; --fence: #ffffff; --tree: #4f9a3a; --tree2: #3f8a2f; --trunk: #8a5a32;
    --tunnel: #2f7de1; --tunnelRing: #1f5fb3; --aframe: #e4572e; --aframe2: #b8401f; --contact: #ffd23f;
    --pole1: #ff4d4d; --pole2: #ffffff; --tire: #1d1d1d; --hud: rgba(255,255,255,.93);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1a14; --card: #17231b; --text: #edf5ea; --muted: #a3b59c; --line: #2a3a2f;
      --title: #fbbf24; --focus: #fbbf24; --btn: #26352b; --best: #4ade80; --worst: #f87171; --undo: #33463a;
      --sky1: #0b1530; --sky2: #2b3a67; --sun: #f4f1d0; --cloud: #5b6b8f; --stars: 1;
      --hill: #2f5a35; --hill2: #264b2c; --grass: #2f6b37; --grass2: #285d30;
      --dirt: #9c7448; --dirtEdge: #7a5634; --fence: #b9c2cc; --tree: #23482a; --tree2: #1c3d23; --trunk: #5a3b22;
      --tire: #3a3a3a; --hud: rgba(23,35,27,.92);
    }
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1a14; --card: #17231b; --text: #edf5ea; --muted: #a3b59c; --line: #2a3a2f;
    --title: #fbbf24; --focus: #fbbf24; --btn: #26352b; --best: #4ade80; --worst: #f87171; --undo: #33463a;
    --sky1: #0b1530; --sky2: #2b3a67; --sun: #f4f1d0; --cloud: #5b6b8f; --stars: 1;
    --hill: #2f5a35; --hill2: #264b2c; --grass: #2f6b37; --grass2: #285d30;
    --dirt: #9c7448; --dirtEdge: #7a5634; --fence: #b9c2cc; --tree: #23482a; --tree2: #1c3d23; --trunk: #5a3b22;
    --tire: #3a3a3a; --hud: rgba(23,35,27,.92);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Jua", -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  .app { max-width: 1040px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  h1 { margin: 0; font-size: 26px; font-weight: 400; }
  h1 span { color: var(--title); }
  .tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tools label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 15px; }
  select, input[type=text], .chip { font: inherit; font-size: 15px; padding: 6px 10px; border-radius: 10px; min-height: 36px;
    border: 1px solid var(--line); background: var(--card); color: var(--text); }
  select:disabled { opacity: .5; }
  .chip { cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); color: #1f2a1c; border-color: transparent; }
  details { margin-bottom: 12px; background: var(--card); border-radius: 14px; padding: 8px 14px; }
  summary { cursor: pointer; font-size: 16px; padding: 4px 0; min-height: 32px; }
  summary small { color: var(--muted); font-size: 14px; margin-left: 4px; }
  .custom { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 0 4px; }
  .custom label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .custom input[type=text] { width: 120px; }
  .note { width: 100%; margin: 0; font-size: 13px; color: var(--muted); }
  .history { list-style: none; margin: 6px 0 4px; padding: 0; font-size: 15px; }
  .history li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line);
    font-variant-numeric: tabular-nums; }
  .history li:first-child { border-top: 0; }
  .history .h-main { font-family: "Rubik", ui-monospace, monospace; font-weight: 600; }
  .history .h-sub { color: var(--muted); font-size: 13px; }

  .stage { position: relative; border-radius: 22px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.15); background: var(--card); }
  .scene-wrap { position: relative; }
  #scene { display: block; width: 100%; height: auto; }

  .hud { position: absolute; z-index: 2; left: 14px; top: 12px; background: var(--hud); border-radius: 16px;
    padding: 8px 14px 10px; box-shadow: 0 4px 14px rgba(0,0,0,.12); backdrop-filter: blur(4px); min-width: 220px; }
  .time { font-family: "Rubik", ui-monospace, monospace; font-weight: 800; font-size: clamp(30px, 4.4vw, 50px);
    line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
  .time .ms { font-size: .55em; color: var(--muted); }
  .hud-row { display: flex; gap: 12px; margin-top: 6px; font-size: 14px; color: var(--muted); white-space: nowrap; }
  .hud-row b { color: var(--text); font-weight: 400; }

  /* course minimap */
  .minimap { position: relative; height: 34px; margin: 0 16px; }
  .minimap .rail { position: absolute; left: 0; right: 0; top: 16px; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .minimap .rail i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffb703, #fb8500); }
  .minimap .mk { position: absolute; top: 9px; transform: translateX(-50%); font-size: 14px; line-height: 1; }
  .minimap .mk.wide { height: 8px; top: 15px; border-radius: 4px; transform: none; }
  .minimap .dogmk { position: absolute; top: -2px; transform: translateX(-50%); font-size: 20px; transition: left .1s linear; }
  .stage-foot { padding: 8px 0 4px; background: var(--card); }

  .toast { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(.6); opacity: 0;
    background: var(--card); color: var(--text); padding: 10px 22px; border-radius: 999px; font-size: clamp(18px, 3vw, 28px);
    box-shadow: 0 6px 20px rgba(0,0,0,.25); pointer-events: none; white-space: nowrap; }
  .toast.show { animation: pop 1.9s ease forwards; }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.6); }
    15% { opacity: 1; transform: translate(-50%,-50%) scale(1.08); } 25% { transform: translate(-50%,-50%) scale(1); }
    80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-62%) scale(1); } }

  .controls { display: flex; gap: 12px; margin: 16px 0 6px; }
  .controls button { flex: 1; height: 60px; border: 0; border-radius: 999px; font: inherit; font-size: 22px;
    cursor: pointer; background: var(--btn); color: var(--text); box-shadow: 0 4px 0 rgba(0,0,0,.14);
    transition: transform .08s, box-shadow .08s, opacity .15s; touch-action: manipulation; }
  .controls button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.14); }
  .controls button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  #main.start { background: var(--go); color: #fff; }
  #main.stop { background: var(--stop); color: #fff; }
  .hint { text-align: center; color: var(--muted); font-size: 14px; margin: 6px 0 14px; }
  .hint kbd { font-family: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
  @media (hover: none) { .hint { display: none; } }

  .laps { background: var(--card); border-radius: 16px; padding: 6px 16px 10px; margin-bottom: 12px; }
  .laps-head { display: flex; justify-content: space-between; align-items: center; padding-top: 6px; }
  .laps-head h2 { margin: 0; font-size: 17px; font-weight: 400; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { font-weight: 400; color: var(--muted); font-size: 14px; text-align: right; padding: 8px 0; }
  th:first-child, td:first-child { text-align: left; }
  td { padding: 10px 0; border-top: 1px solid var(--line); text-align: right;
    font-family: "Rubik", ui-monospace, monospace; font-weight: 600; font-size: 15px; }
  td:first-child { font-family: "Jua", sans-serif; font-weight: 400; }
  tr.best td { color: var(--best); } tr.worst td { color: var(--worst); }
  .badge { font-size: 12px; border: 1px solid currentColor; border-radius: 99px; padding: 0 6px; margin-left: 6px; white-space: nowrap; }

  .undo { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(160%); transition: transform .25s, visibility .25s;
    visibility: hidden; background: var(--undo); color: #fff; border: 1px solid rgba(255,255,255,.18); border-radius: 999px;
    padding: 8px 8px 8px 20px; display: flex; gap: 12px; align-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.35); z-index: 10; font-size: 16px; }
  .undo.show { transform: translateX(-50%) translateY(0); visibility: visible; }
  .undo button { font: inherit; border: 0; border-radius: 999px; min-height: 44px; padding: 8px 18px; background: #ffd23f; color: #1f2a1c; cursor: pointer; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 680px), (max-height: 500px) and (orientation: landscape) {
    .controls { position: sticky; bottom: 0; z-index: 5; margin: 0 -12px; padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
      background: var(--bg); box-shadow: 0 -6px 16px rgba(0,0,0,.08); }
    .undo { bottom: calc(96px + env(safe-area-inset-bottom)); }
  }
  @media (max-width: 680px) {
    .app { padding: 12px 12px 0; }
    .hud { position: static; border-radius: 0; box-shadow: none; min-width: 0; backdrop-filter: none; background: var(--card);
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; padding: 10px 14px; }
    .hud-row { margin-top: 0; }
    h1 { font-size: 22px; }
    select, .chip, input[type=text] { min-height: 44px; }
    summary { min-height: 44px; display: flex; align-items: center; }
    .toast { top: 20%; }
  }

  /* ---------- scene ---------- */
  .stars { opacity: var(--stars); }
  .cloud { animation: drift linear infinite; }
  .c1 { animation-duration: 80s; } .c2 { animation-duration: 110s; animation-delay: -50s; } .c3 { animation-duration: 140s; animation-delay: -90s; }
  @keyframes drift { from { transform: translateX(1260px); } to { transform: translateX(-260px); } }

  /* ---------- poodle character ---------- */
  #dog { --gait: .5s; }
  #dog .ol { stroke: #3b2414; stroke-width: 2; stroke-linejoin: round; paint-order: stroke; }
  #dog .leg, #dog .shin { transform-box: fill-box; transform-origin: 50% 0%; }
  #dog .nb, #dog .ff { --ph: 0; } #dog .fb, #dog .nf { --ph: -.5; }
  #dog.gallop .nb { --ph: 0; } #dog.gallop .fb { --ph: -.1; } #dog.gallop .nf { --ph: -.5; } #dog.gallop .ff { --ph: -.6; }
  #dog .tail { transform-box: fill-box; transform-origin: 100% 100%; animation: wag 1.4s ease-in-out infinite; }
  #dog .ear-n { transform-box: fill-box; transform-origin: 60% 0%; }
  #dog .eye-open { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4.2s infinite; }
  #dog .tilt { transform-box: fill-box; transform-origin: 50% 80%; }
  #dog .bob { transform-box: fill-box; transform-origin: 50% 100%; }
  #dog.running .tail, #dog.wag .tail { animation-duration: .3s; }
  #dog.running .leg { animation: leg var(--gait) linear infinite; animation-delay: calc(var(--gait) * var(--ph)); }
  #dog.running .shin { animation: shin var(--gait) linear infinite; animation-delay: calc(var(--gait) * var(--ph)); }
  #dog.running .bob { animation: bob calc(var(--gait) / 2) ease-in-out infinite alternate; }
  #dog.running.gallop .bob { animation: rock var(--gait) ease-in-out infinite; }
  #dog.running .ear-n { animation: flap calc(var(--gait) / 2) ease-in-out infinite alternate; }
  #dog:not(.running):not(.air) .bob { animation: breathe 2.2s ease-in-out infinite; }
  #dog.sit .tilt { animation: tilt 7s ease-in-out infinite; }
  #dog.air .leg, #dog.air .shin { animation: none; }
  #dog.air .front { transform: rotate(-60deg); } #dog.air .back { transform: rotate(55deg); }
  #dog.air .front .shin { transform: rotate(80deg); } #dog.air .back .shin { transform: rotate(-35deg); }
  #dog.air .ear-n { animation: none; transform: rotate(35deg); }
  #dog .haunch { display: none; }
  #dog.sit .haunch { display: inline; } #dog.sit .back { display: none; }
  #dog.sit .front { transform: rotate(14deg) scaleY(1.15); }
  #dog .eye-happy, #dog .eye-star, #dog .eye-tired, #dog .brow, #dog .sweat, #dog .tongue { display: none; }
  #dog[data-mood="run"] .tongue, #dog[data-mood="tired"] .tongue, #dog[data-mood="drink"] .tongue { display: inline; }
  #dog[data-mood="jump"] .eye-open, #dog[data-mood="idle"] .eye-open, #dog[data-mood="drink"] .eye-open, #dog[data-mood="rest"] .eye-open { display: none; }
  #dog[data-mood="jump"] .eye-happy, #dog[data-mood="idle"] .eye-happy, #dog[data-mood="drink"] .eye-happy, #dog[data-mood="rest"] .eye-happy { display: inline; }
  #dog[data-mood="climb"] .brow { display: inline; }
  #dog[data-mood="star"] .eye-open { display: none; } #dog[data-mood="star"] .eye-star { display: inline; }
  #dog[data-mood="tired"] .eye-open { display: none; } #dog[data-mood="tired"] .eye-tired, #dog[data-mood="tired"] .sweat { display: inline; }
  #dog .acc { display: none; }
  #dog[data-acc="cap"] .acc-cap, #dog[data-acc="glasses"] .acc-glasses, #dog[data-acc="crown"] .acc-crown { display: inline; }
  #speed { display: none; } #speed.on { display: inline; }
  #speed line { animation: dash .22s linear infinite; }

  @keyframes leg { 0% { transform: rotate(32deg); } 50% { transform: rotate(-32deg); } 100% { transform: rotate(32deg); } }
  @keyframes shin { 0% { transform: rotate(0); } 25% { transform: rotate(55deg); } 50%, 100% { transform: rotate(0); } }
  @keyframes wag { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(20deg); } }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-3px); } }
  @keyframes rock { 0%,100% { transform: rotate(-4deg) translateY(0); } 50% { transform: rotate(4deg) translateY(-4px); } }
  @keyframes flap { from { transform: rotate(8deg); } to { transform: rotate(30deg); } }
  @keyframes breathe { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.035); } }
  @keyframes tilt { 0%, 70%, 100% { transform: rotate(0); } 76%, 88% { transform: rotate(-12deg); } }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  @keyframes dash { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 40; } }

  .dust { animation: dust .7s ease-out forwards; }
  @keyframes dust { from { opacity: .6; transform: translate(0,0) scale(.6); } to { opacity: 0; transform: translate(var(--dx), var(--dy, -12px)) scale(1.8); } }
  .confetti { animation: conf 1.4s cubic-bezier(.2,.7,.4,1) forwards; }
  @keyframes conf { from { opacity: 1; transform: translate(0,0) rotate(0); }
    to { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--r)); } }
  #bulge { transform-box: fill-box; transform-origin: 50% 100%; animation: wobble .2s ease-in-out infinite alternate; }
  @keyframes wobble { from { transform: scale(1, 1); } to { transform: scale(1.06, .92); } }

  @media (prefers-reduced-motion: reduce) {
    .cloud, #dog .tail, #dog .eye-open, #dog.running .leg, #dog.running .shin, #dog .bob, #dog.sit .tilt,
    #dog.running .ear-n, #bulge, #speed line { animation: none !important; }
    .dust, .confetti { display: none; }
    .toast.show { animation: fade 2.6s ease forwards; }
    @keyframes fade { 0% { opacity: 0; transform: translate(-50%,-50%); } 10%, 85% { opacity: 1; transform: translate(-50%,-50%); } 100% { opacity: 0; transform: translate(-50%,-50%); } }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🐾 어질리티 <span>스탑워치</span></h1>
    <div class="tools">
      <label>코스 1바퀴
        <select id="lapDur" aria-label="코스 한 바퀴에 걸리는 시간" title="리셋한 뒤에 바꿀 수 있어요">
          <option value="15000">15초</option>
          <option value="20000">20초</option>
          <option value="30000" selected>30초</option>
          <option value="60000">1분</option>
        </select>
      </label>
      <button id="sound" class="chip" aria-pressed="false">🔇 소리</button>
      <button id="theme" class="chip" title="화면 테마 바꾸기">🌓 테마: 자동</button>
    </div>
  </header>

  <details id="customBox">
    <summary>🐶 내 강아지 꾸미기 <small id="titleLine"></small></summary>
    <div class="custom">
      <label>이름 <input type="text" id="dogName" maxlength="8" placeholder="멍멍이" autocomplete="off"></label>
      <label>털색
        <select id="fur">
          <option value="apricot">살구 푸들</option>
          <option value="cream">크림</option>
          <option value="white">화이트</option>
          <option value="choco">초코</option>
          <option value="black">블랙</option>
        </select>
      </label>
      <label>액세서리 <select id="acc"></select></label>
      <p class="note">보내주신 사진 속 살구색 토이푸들(곱슬 털, 처진 귀, 웃는 눈, 파랑·노랑 1983 하네스)을 캐릭터로 그렸어요. 누적 바퀴 수가 쌓이면 칭호와 액세서리가 열려요.</p>
    </div>
  </details>

  <div class="stage">
    <div class="hud">
      <div class="time" aria-hidden="true"><span id="tMain">00:00</span><span class="ms" id="tMs">.00</span></div>
      <div class="hud-row"><span>🏁 <b id="courseLaps">0바퀴</b></span><span>📍 <b id="zone">출발 준비</b></span></div>
    </div>
    <div class="scene-wrap">
      <svg id="scene" viewBox="0 0 1000 560" role="img" aria-label="푸들 캐릭터가 어질리티 코스를 옆으로 달리며 장애물을 넘는 화면. 시간이 흐르면 코스를 따라 이동합니다.">
        <defs>
          <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" style="stop-color: var(--sky1)"/><stop offset="1" style="stop-color: var(--sky2)"/>
          </linearGradient>
          <pattern id="checker" width="12" height="12" patternUnits="userSpaceOnUse">
            <rect width="12" height="12" fill="#fff"/><rect width="6" height="6" fill="#222"/><rect x="6" y="6" width="6" height="6" fill="#222"/>
          </pattern>
        </defs>
        <rect width="1000" height="560" fill="url(#skyG)"/>
        <g class="stars" fill="#fff">
          <circle cx="120" cy="40" r="1.6"/><circle cx="260" cy="80" r="1.2"/><circle cx="410" cy="30" r="1.8"/>
          <circle cx="560" cy="70" r="1.2"/><circle cx="690" cy="35" r="1.5"/><circle cx="760" cy="110" r="1.1"/>
          <circle cx="330" cy="125" r="1.3"/><circle cx="950" cy="140" r="1.4"/><circle cx="60" cy="130" r="1.2"/>
        </g>
        <circle cx="860" cy="80" r="40" fill="var(--sun)"/>
        <g fill="var(--cloud)" opacity=".9">
          <g class="cloud c1"><ellipse cx="0" cy="70" rx="46" ry="16"/><ellipse cx="22" cy="58" rx="26" ry="18"/><ellipse cx="-20" cy="62" rx="20" ry="13"/></g>
          <g class="cloud c2"><ellipse cx="0" cy="130" rx="36" ry="12"/><ellipse cx="14" cy="120" rx="20" ry="14"/></g>
          <g class="cloud c3"><ellipse cx="0" cy="44" rx="56" ry="15"/><ellipse cx="-18" cy="33" rx="26" ry="16"/><ellipse cx="20" cy="36" rx="22" ry="14"/></g>
        </g>
        <g id="parHills"></g>
        <g id="parTrees"></g>
        <g id="parFence" stroke="var(--fence)" stroke-width="4" stroke-linecap="round"></g>
        <rect y="395" width="1000" height="165" fill="var(--grass)"/>
        <rect y="420" width="1000" height="48" fill="var(--dirt)"/>
        <rect y="420" width="1000" height="4" fill="var(--dirtEdge)"/>
        <rect y="464" width="1000" height="5" fill="var(--dirtEdge)"/>
        <g id="parPebbles"></g>

        <g id="world">

    </div>

  <div class="laps" id="lapsBox" hidden>

</div>

<div class="sr" id="live" aria-live="polite"></div>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const el = (tag, attrs = {}, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const OUT = '#3b2414';

  /* ================= poodle character (built from the user's photos) =================
     apricot toy poodle: curly cloud-shaped coat, round fluffy head, curly floppy ear,
     darker beard on the muzzle, brown nose, smiling closed eyes, blue + yellow "1983" harness. */
  // a curly "blob": dark enlarged circles first (outline), then the fill circles on top
  function blob(parent, circles, fill, cls = '') {
    const g = el('g', cls ? { class: cls } : {}, parent);
    circles.forEach(([x, y, r]) => el('circle', { cx: x, cy: y, r: r + 2.1, fill: OUT }, g));
    circles.forEach(([x, y, r]) => el('circle', { cx: x, cy: y, r, style: `fill:${fill}` }, g));
    return g;
  }
  const curls = (parent, pts, color = 'var(--fur2)') => pts.forEach(([x, y, s = 1]) =>
    el('path', { d: `M${x - 3 * s} ${y} q ${3 * s} ${-4 * s} ${6 * s} 0`, fill: 'none', style: `stroke:${color}`, 'stroke-width': 1.3, 'stroke-linecap': 'round' }, parent));
  const leg = (cls, x, fill) => {
    const w = el('g', { transform: `translate(${x} -16)` }, body);
    const g = el('g', { class: `leg ${cls}` }, w);
    blob(g, [[0, 3, 5.5], [0, 9, 5]], fill);
    const s = el('g', { class: 'shin' }, el('g', { transform: 'translate(0 9)' }, g));
    blob(s, [[0, 3, 4.6], [1.5, 7.5, 5]], fill);
    return g;
  };
  const body = $('dogBody');
  // speed-lines live outside the body; tail first (behind)
  const tail = el('g', { class: 'tail' }, body);
  el('path', { d: 'M-18 -28 q -5 -5 -6 -12', fill: 'none', style: 'stroke:var(--fur2)', 'stroke-width': 4, 'stroke-linecap': 'round' }, tail);
  blob(tail, [[-25, -43, 6.5], [-21, -46, 5]], 'var(--fur)');
  leg('fb back', -9, 'var(--fur2)'); leg('ff front', 13, 'var(--fur2)');
  blob(body, [[-14, -24, 10], [-4, -27, 11], [6, -26, 11], [13, -21, 10], [-10, -17, 10], [2, -17, 10], [-18, -19, 8], [12, -33, 9]], 'var(--fur)');
  curls(body, [[-12, -27], [-2, -31], [7, -29], [-7, -19], [3, -20], [-16, -21, .8]]);
  blob(body, [[-12, -10, 9], [-5, -4, 6]], 'var(--fur)', 'haunch');
  // harness: back strap + chest band + "1983" badge
  el('path', { d: 'M-15 -35 L9 -38 L10 -32 L-14 -29 Z', fill: '#2546b0', stroke: '#ffd23f', 'stroke-width': 1.8, 'stroke-linejoin': 'round' }, body);
  el('rect', { x: -2, y: -38.5, width: 5, height: 7, rx: 1.2, fill: '#ffd23f', stroke: OUT, 'stroke-width': .8 }, body);
  leg('nb back', -15, 'var(--fur)'); leg('nf front', 7, 'var(--fur)');
  blob(body, [[16, -18, 7.5], [14, -11, 6.5]], 'var(--fur)');
  el('path', { d: 'M8 -39 L19 -35 L15 -9 L4 -12 Z', fill: '#2546b0', stroke: '#ffd23f', 'stroke-width': 1.8, 'stroke-linejoin': 'round' }, body);
  el('circle', { cx: 11.5, cy: -21, r: 5.6, fill: '#ffd23f', stroke: '#2546b0', 'stroke-width': 1.2 }, body);
  [['19', -22], ['83', -18.2]].forEach(([t, y]) => { const tx = el('text', { x: 11.5, y, 'font-size': 3.9, 'font-family': 'Rubik, sans-serif', 'font-weight': 800, fill: '#2546b0', 'text-anchor': 'middle' }, body); tx.textContent = t; });
  // head
  const head = el('g', { class: 'tilt' }, el('g', { transform: 'translate(20 -47)' }, body));
  blob(head, [[0, 0, 15], [-9, -9, 9], [0, -13, 10], [9, -10, 9], [12, 2, 9], [-11, 1, 9], [-3, -18, 6]], 'var(--fur)');
  curls(head, [[-6, -14], [3, -17], [-11, -4, .8], [6, -12, .8]]);
  el('ellipse', { cx: 8, cy: -3, rx: 8, ry: 6, style: 'fill:var(--cream)', opacity: .85 }, head);
  blob(head, [[14, 7, 7.5], [20, 4, 6], [16, 12, 5.5]], 'var(--muzzle)');
  curls(head, [[13, 11, .7], [18, 9, .7]], 'var(--fur2)');
  el('ellipse', { cx: 24, cy: 2, rx: 4.8, ry: 4, fill: '#4a2c22' }, head);
  el('ellipse', { cx: 25, cy: .6, rx: 1.6, ry: 1, fill: '#fff', opacity: .55 }, head);
  el('path', { class: 'tongue', d: 'M14 12 q 1 9 6 8 q 2 -5 0 -9 z', fill: '#ff6b81', stroke: OUT, 'stroke-width': 1.1 }, head);
  el('path', { d: 'M20 11 q -3 3 -7 1', fill: 'none', stroke: OUT, 'stroke-width': 1.5, 'stroke-linecap': 'round' }, head);
  const eo = el('g', { class: 'eye-open' }, head);
  el('circle', { cx: 9, cy: -4, r: 3.9, fill: '#24160f' }, eo);
  el('circle', { cx: 10.3, cy: -5.5, r: 1.5, fill: '#fff' }, eo); el('circle', { cx: 7.8, cy: -2.8, r: .7, fill: '#fff' }, eo);
  el('path', { class: 'eye-happy', d: 'M5 -3.5 q 4 -4.5 8 0', fill: 'none', stroke: '#24160f', 'stroke-width': 2.3, 'stroke-linecap': 'round' }, head);
  el('path', { class: 'eye-tired', d: 'M5 -4.5 h 8 M6 -4.5 q 3 3.5 6 0', fill: '#24160f', stroke: '#24160f', 'stroke-width': 1.8, 'stroke-linecap': 'round' }, head);
  el('polygon', { class: 'eye-star', points: '9,-10 10.5,-6 14.5,-5.8 11.3,-3.3 12.5,0.8 9,-1.6 5.5,0.8 6.7,-3.3 3.5,-5.8 7.5,-6', fill: '#ffd23f', stroke: '#b45309', 'stroke-width': .9 }, head);
  el('path', { class: 'brow', d: 'M4 -11 l 9 3', stroke: '#24160f', 'stroke-width': 2.1, 'stroke-linecap': 'round' }, head);
  el('ellipse', { cx: 2, cy: 5, rx: 3.8, ry: 2.3, fill: '#ff8fa3', opacity: .75 }, head);
  // curly floppy ear (in front of the head in side view)
  const ear = el('g', { class: 'ear-n' }, el('g', { transform: 'translate(-8 -4) scale(.85)' }, head));
  blob(ear, [[0, 3, 6.5], [-2, 10, 7.5], [0, 18, 6.8], [3, 12, 5], [-1, 24, 4.5]], 'var(--fur2)');
  curls(ear, [[-2, 8, .8], [0, 16, .8], [-2, 21, .7]], 'var(--fur)');
  el('path', { class: 'sweat', d: 'M-14 -16 q -5 7 0 9 q 5 -2 0 -9 z', fill: '#8fd3ff', stroke: OUT, 'stroke-width': 1.1 }, head);
  // unlockable accessories
  el('path', { class: 'acc acc-cap', d: 'M-14 -14 q 8 -20 28 -8 l 11 3 q -3 4 -11 2 q -13 -2 -28 3 z', fill: '#e63946', stroke: OUT, 'stroke-width': 1.6 }, head);
  const gl = el('g', { class: 'acc acc-glasses' }, head);
  el('path', { d: 'M3 -9 h 13 v 6 q -6.5 5 -13 0 z', fill: '#111', stroke: OUT, 'stroke-width': 1 }, gl);
  el('path', { d: 'M5 -8 l 3 0', stroke: '#fff', 'stroke-width': 1.2, opacity: .6 }, gl);
  el('polygon', { class: 'acc acc-crown', points: '-9,-19 -7,-33 -2,-25 3,-36 8,-25 13,-32 12,-18', fill: '#ffd23f', stroke: OUT, 'stroke-width': 1.3 }, head);

  // speed lines (screen space, behind the dog)
  [[-30, 0], [-38, 14], [-28, 28]].forEach(([dx, dy]) => {
    el('line', { x1: 0, y1: 0, x2: -70, y2: 0, transform: `translate(${300 + dx * 2} ${450 - 90 + dy * 2})`, stroke: OUT, 'stroke-width': 5, opacity: .25 }, $('speed'));
    el('line', { x1: 0, y1: 0, x2: -70, y2: 0, transform: `translate(${300 + dx * 2} ${450 - 90 + dy * 2})`, stroke: '#fff', 'stroke-width': 3, opacity: .9 }, $('speed'));
  });

  /* ================= side-scrolling course ================= */
  const GY = 450, X0 = 300, K = 2.0;   // ground line, dog screen x, character scale
  const CL = 4800;                     // course length in px (one lap)
  const OBST = [
    { type: 'hurdle', from: 0.05,  to: 0.085, dur: 0.8, name: '허들 점프!', icon: '🚧' },
    { type: 'weave',  from: 0.11,  to: 0.20,  dur: 2.6, name: '위브폴 지그재그', icon: '🎌' },
    { type: 'tire',   from: 0.222, to: 0.257, dur: 0.85, name: '타이어 통과!', icon: '⭕' },
    { type: 'tunnel', from: 0.33,  to: 0.44,  dur: 2.0, name: '터널 질주', icon: '' },
    { type: 'aframe', from: 0.565, to: 0.665, dur: 2.6, name: 'A-프레임 등반', icon: '🔺' },
    { type: 'hurdle', from: 0.71,  to: 0.745, dur: 0.8, name: '허들 점프!', icon: '🚧' },
    { type: 'hurdle', from: 0.93,  to: 0.965, dur: 0.8, name: '허들 점프!', icon: '🚧' },
  ];
  const BREAKS = [
    { type: 'drink', at: 0.275, name: '물 마시는 중', say: '할짝할짝 💧', icon: '💧' },
    { type: 'sniff', at: 0.50,  name: '킁킁 냄새 맡기', say: '킁킁… 꽃 냄새!', icon: '🌼' },
    { type: 'ball',  at: 0.80,  name: '공놀이 중', say: '공이다! 🎾', icon: '🎾' },
  ];
  const START_DUR = 0.6, SPEED_MIN = 60, SPEED_PREF = 220, SPEED_MAX = 420, BREAK_MAX = 3;
  const wx = f => X0 + f * CL;
  const back = $('back'), front = $('front'), props = $('props');
  const COPIES = [-CL, 0, CL];          // draw the course 3 times so the loop is seamless

  // parallax scenery (each layer repeats every P px and scrolls at its own factor)
  const PAR = [];
  function parallax(id, factor, P, build) {
    const g = $(id), inner = el('g', {}, g);
    [0, P].forEach(off => build(el('g', { transform: `translate(${off} 0)` }, inner), P));
    PAR.push({ inner, factor, P });
  }
  parallax('parHills', 0.12, 1000, (g) => {
    el('path', { d: 'M0 300 Q 120 220 260 280 T 560 270 T 820 250 T 1000 300 L1000 400 L0 400 Z', fill: 'var(--hill2)' }, g);
    el('path', { d: 'M0 330 Q 180 270 380 320 T 760 310 T 1000 330 L1000 400 L0 400 Z', fill: 'var(--hill)' }, g);
  });
  parallax('parTrees', 0.35, 1000, (g) => {
    for (let i = 0; i < 8; i++) {
      const x = 40 + i * 125 + (i % 3) * 18, y = 392, r = 24 + (i % 3) * 7;
      el('rect', { x: x - 5, y: y - 34, width: 10, height: 34, fill: 'var(--trunk)' }, g);
      el('circle', { cx: x, cy: y - 48, r, fill: i % 2 ? 'var(--tree)' : 'var(--tree2)' }, g);
      el('circle', { cx: x - r * .5, cy: y - 40, r: r * .7, fill: i % 2 ? 'var(--tree2)' : 'var(--tree)' }, g);
    }
  });
  parallax('parFence', 0.6, 400, (g) => {
    el('line', { x1: 0, y1: 380, x2: 400, y2: 380 }, g);
    el('line', { x1: 0, y1: 398, x2: 400, y2: 398 }, g);
    for (let x = 10; x < 400; x += 40) el('line', { x1: x, y1: 372, x2: x, y2: 404 }, g);
  });
  parallax('parPebbles', 1, 300, (g) => {
    [[20, 432, 3], [90, 452, 2], [160, 440, 2.5], [230, 458, 2], [270, 430, 1.8]].forEach(([x, y, r]) =>
      el('ellipse', { cx: x, cy: y, rx: r * 1.5, ry: r, fill: 'var(--dirtEdge)', opacity: .7 }, g));
    [[50, 500], [180, 530], [260, 490]].forEach(([x, y]) => el('path', { d: `M${x} ${y} l4 -10 l3 9 l4 -12 l3 13`, fill: 'none', stroke: 'var(--grass2)', 'stroke-width': 2.5, 'stroke-linecap': 'round' }, g));
  });
  parallax('parTufts', 1.35, 500, (g) => {
    [[60, 556], [210, 552], [380, 558]].forEach(([x, y]) => el('path', { d: `M${x} ${y} l6 -22 l5 20 l6 -28 l5 28 l6 -18 l4 20`, fill: 'var(--grass2)', stroke: 'var(--grass2)', 'stroke-width': 3, 'stroke-linejoin': 'round' }, g));
  });

  function drawCourse(off) {
    const B = el('g', { transform: `translate(${off} 0)` }, back), F = el('g', { transform: `translate(${off} 0)` }, front), P = el('g', { transform: `translate(${off} 0)` }, props);
    // start / finish arch
    const sx = wx(0);
    el('rect', { x: sx - 6, y: 420, width: 12, height: 48, fill: 'url(#checker)' }, B);
    [-80, 80].forEach(dx => el('rect', { x: sx + dx - 5, y: 238, width: 10, height: 186, fill: '#6b7280', stroke: OUT, 'stroke-width': 1.5 }, B));
    el('rect', { x: sx - 92, y: 226, width: 184, height: 34, rx: 6, fill: 'url(#checker)', stroke: OUT, 'stroke-width': 2 }, B);
    el('rect', { x: sx - 62, y: 231, width: 124, height: 24, rx: 5, fill: '#fff' }, B);
    const t = el('text', { x: sx, y: 249, 'font-size': 18, 'font-family': 'Rubik, sans-serif', 'font-weight': 800, fill: '#1f2a1c', 'text-anchor': 'middle' }, B); t.textContent = 'START · GOAL';
    OBST.forEach(o => {
      const a = wx(o.from), b = wx(o.to), m = (a + b) / 2;
      if (o.type === 'hurdle') {
        [-30, 30].forEach(dx => {
          el('rect', { x: m + dx - 6, y: GY - 84, width: 12, height: 84, rx: 3, fill: '#fff', stroke: OUT, 'stroke-width': 1.5 }, B);
          el('rect', { x: m + dx - 6, y: GY - 74, width: 12, height: 10, fill: dx < 0 ? '#3a86ff' : '#ff006e' }, B);
          el('rect', { x: m + dx - 6, y: GY - 44, width: 12, height: 10, fill: dx < 0 ? '#3a86ff' : '#ff006e' }, B);
        });
        const bar = { x1: m - 30, y1: GY - 60, x2: m + 30, y2: GY - 60, 'stroke-width': 8, 'stroke-linecap': 'round' };
        el('line', { ...bar, stroke: OUT, 'stroke-width': 11 }, B);
        el('line', { ...bar, stroke: '#ff4d4d' }, B);
        el('line', { ...bar, stroke: '#fff', 'stroke-dasharray': '8 8' }, B);
      } else if (o.type === 'tire') {
        const cy = GY - 88;
        [-56, 56].forEach(dx => el('rect', { x: m + dx - 5, y: GY - 170, width: 10, height: 170, fill: '#6b7280', stroke: OUT, 'stroke-width': 1.5 }, B));
        el('rect', { x: m - 61, y: GY - 176, width: 122, height: 10, fill: '#6b7280', stroke: OUT, 'stroke-width': 1.5 }, B);
        [[-14, -166, -48], [14, -166, -48]].forEach(([dx]) => el('line', { x1: m + dx, y1: GY - 166, x2: m + dx * .6, y2: cy - 48, stroke: '#444', 'stroke-width': 2.5 }, B));
        el('ellipse', { cx: m, cy, rx: 18, ry: 52, fill: 'none', stroke: 'var(--tire)', 'stroke-width': 14 }, B);
        el('ellipse', { cx: m, cy, rx: 18, ry: 52, fill: 'none', stroke: '#f4a261', 'stroke-width': 3, 'stroke-dasharray': '9 9' }, B);
        const arc = `M${m} ${cy + 52} A 18 52 0 0 0 ${m + 18} ${cy} A 18 52 0 0 0 ${m} ${cy - 52}`;
        el('path', { d: arc, fill: 'none', stroke: 'var(--tire)', 'stroke-width': 14 }, F);
        el('path', { d: arc, fill: 'none', stroke: '#f4a261', 'stroke-width': 3, 'stroke-dasharray': '9 9' }, F);
      } else if (o.type === 'weave') {
        for (let i = 0; i < 6; i++) {
          // the dog passes pole i on alternate sides: odd poles are drawn in front of it
          const x = a + (b - a) * (i + .5) / 6, g = i % 2 ? F : B, y0 = GY + (i % 2 ? 6 : -4);
          el('line', { x1: x, y1: y0, x2: x, y2: y0 - 120, stroke: OUT, 'stroke-width': 10, 'stroke-linecap': 'round' }, g);
          el('line', { x1: x, y1: y0, x2: x, y2: y0 - 120, stroke: i % 2 ? 'var(--pole2)' : 'var(--pole1)', 'stroke-width': 7, 'stroke-linecap': 'round' }, g);
          el('circle', { cx: x, cy: y0 - 122, r: 6, fill: '#ffd23f', stroke: OUT, 'stroke-width': 1.5 }, g);
        }
      } else if (o.type === 'aframe') {
        const h = 140;
        el('polygon', { points: `${a + 10},${GY - 10} ${m + 10},${GY - h - 10} ${b + 10},${GY - 10}`, fill: 'var(--aframe2)' }, B);
        el('polygon', { points: `${a},${GY} ${m},${GY - h} ${b},${GY}`, fill: 'var(--aframe)', stroke: OUT, 'stroke-width': 2 }, B);
        const lerp = (x1, y1, x2, y2, t) => [x1 + (x2 - x1) * t, y1 + (y2 - y1) * t];
        [[a, b], [b, a]].forEach(([s]) => { const [cx, cy] = lerp(s, GY, m, GY - h, .3); el('line', { x1: s, y1: GY, x2: cx, y2: cy, stroke: 'var(--contact)', 'stroke-width': 8, 'stroke-linecap': 'round' }, B); });
        for (let i = 1; i < 8; i++) {
          const t = i / 8, [lx, ly] = lerp(a, GY, m, GY - h, t), [rx, ry] = lerp(b, GY, m, GY - h, t);
          el('line', { x1: lx, y1: ly, x2: lx + 8, y2: ly + 10, stroke: 'rgba(0,0,0,.25)', 'stroke-width': 3 }, B);
          el('line', { x1: rx, y1: ry, x2: rx - 8, y2: ry + 10, stroke: 'rgba(0,0,0,.25)', 'stroke-width': 3 }, B);
        }
        o.h = h; o.half = (b - a) / 2;
      } else if (o.type === 'tunnel') {
        const top = GY - 92;
        el('rect', { x: a, y: top + 8, width: b - a, height: 92, rx: 46, fill: 'rgba(0,0,0,.18)' }, F);
        el('rect', { x: a, y: top, width: b - a, height: 94, rx: 46, fill: 'var(--tunnel)', stroke: OUT, 'stroke-width': 2.5 }, F);
        for (let x = a + 30; x < b - 20; x += 26) el('path', { d: `M${x} ${top + 2} q 8 45 0 90`, fill: 'none', stroke: 'var(--tunnelRing)', 'stroke-width': 4 }, F);
        el('rect', { x: a + 30, y: top + 14, width: b - a - 60, height: 8, rx: 4, fill: 'rgba(255,255,255,.3)' }, F);
        [a + 14, b - 14].forEach(x => { el('ellipse', { cx: x, cy: top + 47, rx: 16, ry: 46, fill: 'var(--tunnelRing)', stroke: OUT, 'stroke-width': 2 }, F); el('ellipse', { cx: x, cy: top + 49, rx: 10, ry: 38, fill: '#0b1d3a' }, F); });
      }
    });
    BREAKS.forEach(bk => {
      const x = wx(bk.at) + 92;
      if (bk.type === 'drink') {
        el('path', { d: `M${x - 22} ${GY - 16} h 44 l -6 16 h -32 z`, fill: '#e63946', stroke: OUT, 'stroke-width': 2 }, P);
        el('ellipse', { cx: x, cy: GY - 16, rx: 22, ry: 5, fill: '#7cc7ff', stroke: OUT, 'stroke-width': 1.5 }, P);
      } else if (bk.type === 'sniff') {

    const colors = ['#ff006e', '#ffbe0b', '#3a86ff', '#8338ec', '#06d6a0', '#fb5607'];
    for (let i = 0; i < 44; i++) {
      const r = el('rect', { x: X0, y: 260, width: 9, height: 14, fill: colors[i % colors.length], class: 'confetti' }, $('confettiLayer'));
      const a = Math.random() * Math.PI - Math.PI, v = 90 + Math.random() * 200;
      r.style.setProperty('--dx', Math.cos(a) * v + 'px');
      r.style.setProperty('--dy', (Math.sin(a) * v + 120) + 'px');
      r.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
      r.addEventListener('animationend', () => r.remove());
    }
  }

  /* ================= laps ================= */
  const splitsOf = laps => laps.map((t, i) => t - (laps[i - 1] || 0));
  function renderLaps() {
    const body = $('laps'), box = $('lapsBox');
    $('flags').innerHTML = '';
    box.hidden = !st.laps.length && elapsed() === 0;
    if (!st.laps.length) { body.innerHTML = '<tr><td colspan="3" style="color:var(--muted)">아직 랩 기록이 없어요</td></tr>'; return; }
    const splits = splitsOf(st.laps);
    const min = Math.min(...splits), max = Math.max(...splits), n = splits.length;
    body.innerHTML = splits.map((sp, i) => {
      const cls = n >= 2 && sp === min ? 'best' : n >= 3 && sp === max ? 'worst' : '';
      const badge = cls === 'best' ? '<span class="badge">가장 빠름</span>' : cls === 'worst' ? '<span class="badge">가장 느림</span>' : '';
      return `<tr class="${cls}"><td>랩 ${i + 1}${badge}</td><td>${fmtFull(sp)}</td><td>${fmtFull(st.laps[i])}</td></tr>`;
    }).reverse().join('');
    // lap flags planted on the course where each lap was pressed
    const shown = st.laps.slice(-12), first = st.laps.length - shown.length;
    shown.forEach((t, j) => {
      const { g, k } = locate((t % st.lapDur) / 1000);
      const x = wx(g.f0 + (g.f1 - g.f0) * k) - 50;
      COPIES.forEach(off => {
        const gr = el('g', { transform: `translate(${off} 0)` }, $('flags'));
        el('line', { x1: x, y1: GY - 6, x2: x, y2: GY - 96, stroke: OUT, 'stroke-width': 3 }, gr);
        el('path', { d: `M${x} ${GY - 96} l44 14 l-44 14 z`, fill: '#ffbe0b', stroke: '#b45309', 'stroke-width': 1.5 }, gr);
        const tx = el('text', { x: x + 16, y: GY - 76, 'font-size': 18, 'font-family': 'Rubik, sans-serif', 'font-weight': 800,
          fill: '#5b3a00', stroke: '#fff', 'stroke-width': 3, 'paint-order': 'stroke', 'text-anchor': 'middle' }, gr);
        tx.textContent = first + j + 1;
      });
    });
  }

  function renderHistory() {
    const box = $('historyBox'), list = $('history');
    box.hidden = !st.history.length;
    list.innerHTML = '';
    st.history.forEach(h => {
      const d = new Date(h.d), li = document.createElement('li');
      const left = document.createElement('span'), main = document.createElement('span'), sub = document.createElement('span'), date = document.createElement('span');
      main.className = 'h-main'; main.textContent = fmtFull(h.total);
      sub.className = 'h-sub'; sub.textContent = ` · 코스 ${h.course}바퀴 · 랩 ${h.laps}개${h.best ? ' · 최고 랩 ' + fmtFull(h.best) : ''}`;
      date.className = 'h-sub'; date.textContent = `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      left.append(main, sub); li.append(left, date); list.appendChild(li);
    });
  }

  function renderCustom() {
    const sel = $('acc');
    sel.innerHTML = ACCS.map(([v, label, need]) =>
      `<option value="${v}" ${st.total < need ? 'disabled' : ''}>${st.total < need ? '🔒 ' : ''}${label}${st.total < need ? ` (누적 ${need}바퀴)` : ''}</option>`).join('');
    sel.value = st.acc;
    $('titleLine').textContent = `· 🏅 ${titleOf(st.total)} (누적 ${st.total}바퀴)`;
  }

  /* ================= controls ================= */
  function syncButtons() {
    const t = elapsed(), run = running();
    mainBtn.textContent = run ? '정지' : (t ? '계속' : '시작');
    mainBtn.className = run ? 'stop' : 'start';
    secBtn.textContent = run || t === 0 ? '랩' : '리셋';
    secBtn.disabled = !run && t === 0;
    lapSel.disabled = t !== 0;
    lapSel.value = String(st.lapDur);
  }
  function toggle() {
    if (running()) {
      const done = Math.floor(elapsed() / st.lapDur);
      if (done > lastCourseLap) { const n = done - lastCourseLap; lastCourseLap = done; celebrate(done, n); }
      st.base = elapsed(); st.since = null; perfSince = null; cancelAnimationFrame(raf);
      announce(`정지, ${fmtFull(st.base)}`); setWake(false);
    } else {
      st.since = Date.now(); perfSince = performance.now();
      lastCourseLap = Math.floor(st.base / st.lapDur); lastSegI = -1; lastPerf = 0;
      hideUndo();
      if (st.base === 0) say('가자! 🐾', .9);
      cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); setWake(true);
    }
    save(); syncButtons(); renderLaps(); frame();
  }
  function lap() {
    if (!running()) return;
    const t = Math.floor(elapsed() / 10) * 10;
    const prevMin = st.laps.length ? Math.min(...splitsOf(st.laps)) : Infinity;
    st.laps.push(t); save(); renderLaps();
    const n = st.laps.length, sp = t - (st.laps[n - 2] || 0);
    if (n >= 2 && sp < prevMin) { say('신기록이다! 🏆', 1.2); showToast(`🏆 랩 ${n} 신기록!`); SFX.best(); buzz([30, 30, 30]); }
    else { say(`멍! 랩 ${n}`, .9); SFX.lap(); buzz(25); }
    announce(`랩 ${n}, 구간 ${fmtFull(sp)}`);
  }
  let undoState = null, undoTimer = null;
  function hideUndo() { const u = $('undo'); u.classList.remove('show'); u.inert = true; undoState = null; clearTimeout(undoTimer); }
  function reset() {
    if (running() || elapsed() === 0) return;
    const total = st.base, splits = splitsOf(st.laps);
    undoState = { base: st.base, laps: st.laps.slice() };
    st.history.unshift({ d: Date.now(), total, course: Math.floor(total / st.lapDur), laps: st.laps.length, best: splits.length ? Math.min(...splits) : 0 });
    st.history = st.history.slice(0, 20);
    st.base = 0; st.laps = []; lastCourseLap = 0;
    save(); renderLaps(); renderHistory(); syncButtons(); frame();
    const u = $('undo'); u.inert = false; u.classList.add('show');
    clearTimeout(undoTimer); undoTimer = setTimeout(hideUndo, 5000);
    announce('기록을 초기화하고 지난 기록에 저장했습니다. 5초 안에 되돌릴 수 있습니다.');
  }
  $('undoBtn').addEventListener('click', () => {
    if (!undoState || running()) return;
    st.base = undoState.base; st.laps = undoState.laps; st.history.shift();
    lastCourseLap = Math.floor(st.base / st.lapDur);
    hideUndo(); save(); renderLaps(); renderHistory(); syncButtons(); frame(); announce('기록을 되돌렸습니다.');
    mainBtn.focus();
  });

  async function share() {
    const t = elapsed(), splits = splitsOf(st.laps);
    const text = `🐾 ${dogName()}의 어질리티 기록\n⏱ 총 ${fmtFull(t)} · 코스 ${Math.floor(t / st.lapDur)}바퀴\n` +
      (splits.length ? `🏁 랩 ${splits.length}개 · 가장 빠른 랩 ${fmtFull(Math.min(...splits))}\n` : '') + `🏅 ${titleOf(st.total)}\n${location.href}`;
    try {
      if (navigator.share) { await navigator.share({ text }); return; }
      await navigator.clipboard.writeText(text); showToast('📋 기록을 복사했어요');
    } catch (e) { if (e && e.name !== 'AbortError') showToast('공유하지 못했어요'); }
  }

  [mainBtn, secBtn, ...document.querySelectorAll('.chip')].forEach(b => b.addEventListener('mousedown', e => e.preventDefault()));
  ['lapDur', 'fur', 'acc'].forEach(id => $(id).addEventListener('change', e => setTimeout(() => e.target.blur(), 0)));
  mainBtn.addEventListener('click', toggle);
  secBtn.addEventListener('click', () => running() ? lap() : reset());
  lapSel.addEventListener('change', () => { st.lapDur = +lapSel.value; segs = buildTimeline(); save(); renderLaps(); frame(); });
  $('share').addEventListener('click', share);
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
    const tag = e.target.tagName;
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || tag === 'SUMMARY') return;
    if (e.code === 'Space') {
      if (e.target === secBtn || e.target === $('undoBtn') || e.target === mainBtn) return;
      e.preventDefault(); toggle();
    }
    else if (e.code === 'KeyL') lap();
    else if (e.code === 'KeyR') reset();
  });

  function applyLook() {
    const c = FUR[st.fur];
    for (const k in c) dog.style.setProperty('--' + k, c[k]);
    dog.dataset.acc = st.acc;
    $('fur').value = st.fur; $('dogName').value = st.name;
    const sb = $('sound'); sb.setAttribute('aria-pressed', String(st.sound)); sb.textContent = st.sound ? '🔊 소리' : '🔇 소리';
    $('theme').textContent = { auto: '🌓 테마: 자동', light: '☀️ 테마: 라이트', dark: '🌙 테마: 다크' }[st.theme];
    if (st.theme === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = st.theme;
  }
  $('fur').addEventListener('change', e => { st.fur = e.target.value; applyLook(); save(); });
  $('acc').addEventListener('change', e => { st.acc = e.target.value; applyLook(); save(); });
  $('dogName').addEventListener('input', e => { st.name = e.target.value.slice(0, 8); save(); frame(); });
  $('sound').addEventListener('click', () => { st.sound = !st.sound; applyLook(); save(); if (st.sound) ensureAudio().then(SFX.lap); });
  $('theme').addEventListener('click', () => { st.theme = THEMES[(THEMES.indexOf(st.theme) + 1) % 3]; applyLook(); save(); });

  window.addEventListener('storage', e => {
    if (e.key !== KEY) return;
    load(); segs = buildTimeline(); applyLook(); renderCustom(); renderLaps(); renderHistory(); syncButtons();
    lastCourseLap = Math.floor(elapsed() / st.lapDur);
    cancelAnimationFrame(raf); if (running()) raf = requestAnimationFrame(loop); else frame();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    resync(); lastPerf = 0; if (running()) setWake(true); frame();
  });
  addEventListener('pageshow', () => { resync(); frame(); });
  addEventListener('resize', () => { measureHud(); bubbleCache.text = ''; frame(); });
  mobileMQ.addEventListener('change', () => { measureHud(); frame(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { bubbleCache.text = ''; measureHud(); frame(); });

  /* ================= self test: agilitySelfTest() in the console ================= */
  window.agilitySelfTest = () => {
    const out = [];
    const ok = (name, cond, info = '') => out.push({ test: name, pass: !!cond, info: String(info) });
    for (const d of DURS) {
      const tl = buildTimeline(d), sum = tl[tl.length - 1].t1;
      ok(`${d / 1000}s: segments sum to lap length`, Math.abs(sum - d / 1000) < 1e-9, sum.toFixed(6));
      ok(`${d / 1000}s: every segment has positive duration`, tl.every(g => g.dur > 0));
      const runs = tl.filter(g => g.kind === 'run'), sp = runs[0].speed;
      ok(`${d / 1000}s: run speed in natural range`, sp >= SPEED_MIN - 1e-6 && sp <= SPEED_MAX + 1e-6, sp.toFixed(1) + 'px/s');
      ok(`${d / 1000}s: all runs share one speed`, runs.every(r => Math.abs(r.speed - sp) < 1e-6));
      ok(`${d / 1000}s: breaks are short`, tl.filter(g => g.kind === 'break').every(g => g.dur <= BREAK_MAX + 1e-6));
      let lastF = -1, mono = true;
      for (let i = 0; i <= 2000; i++) { const tau = d / 1000 * i / 2000 - 1e-9; const { g, k } = locate(Math.max(0, tau), tl); const f = g.f0 + (g.f1 - g.f0) * k; if (f < lastF - 1e-9) mono = false; lastF = f; }
      ok(`${d / 1000}s: position never moves backwards`, mono);
      const gait = clamp(40 * K / sp, 0.15, 1.3);
      ok(`${d / 1000}s: leg cadence not clamped (feet match ground)`, gait > 0.15 && gait < 1.3, gait.toFixed(3) + 's');
    }
    ok('fmt 59.999s', fmtFull(59999) === '00:59.99', fmtFull(59999));
    ok('fmt 1h', fmtFull(3600000) === '1:00:00.00', fmtFull(3600000));
    const bad = sanitize({ base: -5, since: 'x', laps: [3, 'a', NaN, 1], lapDur: 0, fur: 'zzz', acc: 'crown', total: 3, theme: 'neon', sound: 'yes',
      history: [{ d: 1, total: 5, course: '<img>', laps: 'x' }, { total: 1 }] });
    ok('sanitize rejects bad values', bad.base === 0 && bad.since === null && bad.laps.join() === '1,3' && bad.lapDur === 30000 && bad.fur === 'apricot' && bad.acc === 'none' && bad.theme === 'auto' && bad.sound === false);
    ok('sanitize cleans history', bad.history.length === 1 && bad.history[0].course === 0 && bad.history[0].laps === 0);
    ok('sanitize(null) gives defaults', sanitize(null).lapDur === 30000);
    const laps = [1230, 2470, 3700].map(t => Math.floor(t / 10) * 10), sp = splitsOf(laps);
    ok('splits add up to total', sp.reduce((a, b) => a + b, 0) === laps[laps.length - 1]);
    const failed = out.filter(r => !r.pass);
    console.table(out);
    return { passed: out.length - failed.length, failed: failed.length, total: out.length, failures: failed };
  };

  applyLook(); renderCustom(); syncButtons(); renderLaps(); renderHistory(); measureHud(); frame();
  if (running()) { raf = requestAnimationFrame(loop); setWake(true); }
})();
</script>
</body>
</html>
